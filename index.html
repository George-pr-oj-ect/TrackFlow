<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=JetBrains+Mono:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>TrackFlow</title>
</head>
<body>
    <div class="app">
       <header class="topbar">
    <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">TrackFlow</span>
    </div>
    <p class="brand-subtitle">Activity & Audit Log</p>

    <div class="history-controls">
        <button class="undo-btn" title="Undo last action">↺ Undo</button>
        <button class="redo-btn" title="Redo undone action">↻ Redo</button>
    </div>
        <p class="undo-redo-error"></p>
</header>

        <main class="layout">
            <section class="log-form">
                <h2>Log an action</h2>
                <input type="text" class="action-input" placeholder="What happened? e.g. Created invoice #4521">
                <button class="log-btn">Log Action</button>
                <p class="form-message"></p>
            </section>

            <section class="log-form">
                <h2>Log action status</h2>
                <input type="text" class="status-input" placeholder="What is the action status? e.g. Finished, Pending">
                <button class="status-btn">Log Status</button>
                <p class="status-message"></p>
                
            </section>

            <section class="log-feed">
                <div class="feed-header">
                    <h2>Activity Feed</h2>
                    <span class="entry-count">0 entries</span>
                </div>
                <div class="entries"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
